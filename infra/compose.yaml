services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mianshiya
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mianshiya"]
      interval: 3s
      timeout: 2s
      retries: 60
    mem_limit: 256m
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 128m
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: "8gb"
      cluster.routing.allocation.disk.watermark.high: "5gb"
      cluster.routing.allocation.disk.watermark.flood_stage: "2gb"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:59200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
